# VENN v0 training config (Hydra). Every ML hyperparameter lives here (D-014).
# Override on the CLI, e.g.:  python -m src.train.train train.max_steps=400 train.lambda_white=5
defaults:
  - _self_

seed: 0
device: cuda            # falls back to cpu automatically if CUDA is unavailable

# --- synthetic generator (GenConfig fields; D-009 / D-013) ---------------------------------
data:
  T: 2000
  H: 64
  W: 64
  n_stationary: 1
  n_cyclic: 3
  n_chaotic: 6
  cyclic_periods: [60.0, 140.0, 300.0]
  ou_tau: 200.0
  lorenz_dt: 0.01
  lorenz_subsample: 5
  sst_lag: 3
  sst_shared_w: 0.8
  sst_chaotic_w: 0.5
  sst_blur_sigma: 2.0
  obs_noise: 0.05
  # --- generator rev2 (D-021): fixes the three defects the field figures exposed (F-8).
  # GenConfig's own defaults keep the OLD behaviour, so pre-2026-08-27 runs still reproduce.
  signed_patterns: true   # dipoles + basin waves + zero-mean band -> cell covariance can be < 0,
                          # which is what makes channel decorrelation reachable at all (F-4)
  periodic_x: true        # longitude wraps, so no dead border from edge-clipped bumps
  place_full_domain: true # mode centres over the whole grid (was a 12-cell margin -> dead ring)
  wave_kmax: 2            # largest wavenumber of the wave patterns
  wave_env_sigma: 15.0    # window waves into regional packets; an un-enveloped wave
                          # covers all 4096 cells at |phi|=1 and swamps everything else
  sst_tau: 20.0           # SST = AR1 low-pass response to SSH forcing (was a 3-step shift, which
                          # left corr(SSH,SST) = 0.98); ~64 deg phase lag at period 60
  n_private_ssh: 2        # modes visible only in SSH
  n_private_sst: 2        # modes visible only in SST
  # --- generator rev3 (D-025, user 2026-09-01): STATIONARY MEANS CONSTANT.
  # The old mode 0 was an OU drift, and `_ou_series` standardizes, so it carried UNIT VARIANCE --
  # as much temporal energy as the sinusoids. It was never a stationary signal. Now mode 0 is a
  # static pattern with a flat amplitude, living in the field's TIME MEAN (measured: the field's
  # time-mean map correlates 1.000 with the mode-0 pattern, rms 0.818 vs field std 1.0).
  stationary_constant: true
  stationary_amp: 1.0     # the constant level, in units of the other modes' unit std

# --- selection-mask encoder (D-015) --------------------------------------------------------
model:
  K: 16                 # number of channels; first smoke was K=16, go deeper later
  temp0: 1.0            # initial sigmoid temperature
  temp1: 1.0            # final temperature. 1.0 = NO anneal (default): annealing to 0.1
                        # saturates the sigmoids and freezes the masks before they organize
                        # (offcorr2 stalls at 0.53 vs 0.27 un-annealed). D-016.
  norm: none            # s_i normalization: none (whitening owns scale) | sqrt | softcount(ablation)
  init: multiscale      # multiscale (smooth footprints, own scale each) | random | flat(degenerate)
  init_std: 1.5         # logit std at init -> masks span a real 0..1 range, not all ~0.5
  sigma_min: 1.0        # smallest init footprint length scale, in grid cells
  sigma_max: 16.0       # largest init footprint length scale (basin-scale band)
  signed: false         # DIAGNOSTIC ABLATION only: tanh masks in [-1,1] (D-005 rejects these)
  # D-020 scale ladder: per-channel target footprint, as a fraction of the (V,H,W) volume.
  # ch0 -> size_max_frac (basin-scale), ch(K-1) -> size_min_frac (small energetic patch).
  size_max_frac: 0.30   # largest target footprint  (~2458 of 8192 cells)
  size_min_frac: 0.002  # smallest target footprint (~16 cells)

# --- training (D-015) ----------------------------------------------------------------------
train:
  max_steps: 5000       # ~2500 steps to converge decorrelation; 5000 is safe
  batch: 128            # consecutive pairs per step; must be >= 2*K for full-rank covariance
  lr: 0.05
  whitening: corr       # corr (differentiable off-diag decorrelation; DEFAULT, D-017)
                        # | hard (detached ZCA -- ablation, all channels merge into one)
                        # | soft (raw-cov penalty -- ablation, masks collapse to 0)
  white_eps: 1.0e-3     # eigenvalue floor for the ZCA inverse-sqrt (on the CORRELATION matrix)
  lambda_slow: 1.0      # weight on the slowness Rayleigh quotient. NOTE: at init its gradient is
                        # ~24x weaker than the decorrelation term's, so raise it to give slowness
                        # real influence over the solution.
  lambda_white: 1.0     # weight on mean off-diagonal corr^2 (the reference scale for the others)
  grad_clip: 10.0       # global grad-norm clip; tames spikes from near-degenerate directions
  lambda_var: 1.0       # anti-death hinge: relu(1 - std(s_i/sqrt(count_i)))^2, mean over channels
  lambda_energy: 0.2    # D-019 energy floor: relu(1 - e_i/e_ref)^2, e_i = var(s_i)/count_i^2.
                        # Without it L_slow drives every kernel to the dead domain edges (F-6).
  lambda_recon: 0.3     # D-019 coverage: 1 - R^2 of the best per-batch linear decode of the field
                        # from [1,S]. Also penalizes redundant channels. 0 disables (skips the solve).
  lambda_size: 0.3      # D-020 scale ladder: relu(|log(count_i/target_i)| - log(size_tol))^2.
                        # 0 disables -> every mask shrinks to a tiny patch (median 28 cells).
  size_tol: 2.0         # free within this factor of the target; penalized only outside it
  recon_ridge: 1.0e-3   # ridge on the K+1 normal equations (relative to B; channels standardized)

  # --- D-024 spectral band ladder: assign each channel a TIMESCALE ------------------------------
  # Why this exists: mean slowness is ONE objective for all K channels, so raising K just adds
  # near-duplicates of the dominant (slow) regime -- measured populations 3/0/1 (K=4) ... 36/10/18
  # (K=64), slow-dominated at every K. This is the temporal analogue of the D-020 size ladder.
  spectral:
    enable: true
    win_len: 512        # window length for the periodogram. Must resolve the slowest band:
                        # >= ~2x slow_period_min, and << T so window starts still randomize.
    n_win: 4            # windows averaged per step (periodogram variance is high with just one)
    pop_target: [1, 3, 6]   # rung proportions = the CLAUDE.md target population, scaled to K.
                            # K=16 -> 2 slow / 5 cyclic / 9 fast.
    slow_period_min: 128.0  # slow rungs: put power at periods >= this
    fast_period_max: 24.0   # fast rungs: put power at periods <= this
    cyclic_period_max: 320.0  # cyclic rungs tile [fast_period_max, this] -- INTENTIONALLY
                        # overlapping the slow band: the testbed's cycles are 60/140/300 while the
                        # OU is tau=200, so a partition at 128 would put periods 140 and 300 out of
                        # reach of every cyclic rung. line_cap/line_target do the separating.
    band_target: 0.5    # hinge: >= this fraction of channel power inside its assigned band
    line_target: 0.85   # cyclic rungs: >= this fraction within +-2 bins of the peak (truth
                        # cyclic modes measure 0.94; the stationary one 0.67)
    line_cap: 0.75      # slow AND fast rungs: <= this, i.e. a hump, not a line. Sits in the
                        # 0.67 / 0.94 gap measured on the hidden truth (src/probes/family.py).
    # GRADIENT-matched to lambda_white at init, not value-matched (D-019 convention). Measured at
    # init, K=16, seed 0: |g_white|=3.9e-3, |g_band|=7.8e-4, |g_line|=1.0e-3 -> 5.0 and 3.9.
    lambda_band: 5.0
    lambda_line: 4.0
    # --- D-027: which SHAPE term decides cyclic vs chaotic ---------------------------------------
    # structure = hinge on the labeller's OWN quantity, `trend + osc` over total, cut at 0.5 (D-026).
    #             DEFAULT. line = the D-024 original (+-2 bins around the peak, on 512-windows);
    #             kept as an ablation. Measured on run 20260901_080506, `line_cap` was SILENT on all
    #             nine fast rungs while six of them sat within 0.15 of the readout's boundary -- the
    #             objective and the readout were not asking the same question.
    shape_objective: structure
    struct_rungs: fast    # fast = L_struct caps the FAST rungs only; cyclic rungs keep L_line (DEFAULT).
                          # all  = L_struct on cyclic AND fast rungs (first D-027 variant). Measured on
                          #        seed 0: all five cyclic rungs collapsed onto the period-60 cycle
                          #        (baseline 286/143/61/61/61), since trend+osc credits ANY clean peak.
    struct_target: 0.85   # cyclic rungs: structure share >= this. The hidden cyclic modes measure
                          # 0.94, so this is just under what the physics itself achieves.
    struct_cap: 0.30      # fast rungs: structure share <= this. The hidden CHAOTIC modes measure
                          # 0.17-0.35 (median 0.21), so a fast rung is asked for no more oscillatory
                          # character than the truth has. Both bars leave a MARGIN either side of
                          # the 0.5 cut, so a satisfied channel is unambiguous, not a coin flip.
    lambda_struct: 2.3    # GRADIENT-matched to lambda_white at init (D-019), K=16 seed 0, fast rungs
                          # only: |g_white|=5.1e-3, |g_struct|=2.3e-3 -> 2.26 (.tmps/grad_match.py).
                          # (3.5 when the term also covered the cyclic rungs, struct_rungs: all.)
    # --- what the SLOW rungs are asked for (D-025) ---
    slow_objective: level   # level  = be CONSTANT (the user's definition of stationary): drives the
                            #          rung with L_level and EXEMPTS it from l_var / l_energy /
                            #          L_band / L_line, all of which presume a channel fluctuates.
                            # memory = be a slow DRIFT (my earlier misreading). Kept as an ablation.
    flat_target: 0.98   # hinge: level/(level+fluct) >= this on the slow rungs. r = 1/(1+amp_ratio),
                        # and family.py calls a series flat at amp_ratio < 0.05, i.e. r > 0.952.
                        # 0.98 (amp_ratio ~0.02) sits PAST the cut, so the hinge still pushes when a
                        # channel reaches it. 0.95 landed exactly on the cut: the push faded to ~0
                        # just before the line and rungs parked at amp_ratio 0.05-0.07 (e.g. seed 3
                        # ch0 at 0.059). Measured, 5 seeds (D-027): flat channels 0.8 -> 1.6 per
                        # seed, obedience 0.93 -> 0.97, cyclic coverage and recon unchanged. A target
                        # of 0.8 (amp_ratio 0.25) was rejected earlier: the hinge quits far too soon.
    slow_size_frac: 0.0   # footprint target for the FLAT rungs, overriding their place on the D-020
                        # size ladder. 0 = keep the ladder value (DEFAULT).
                        # TESTED AND REJECTED at 0.08 (run 20260901_080655 vs 20260901_080506): the
                        # footprint did halve, 2590 -> 1318 cells, but alignment with the constant
                        # mode's own pattern did NOT improve (|corr| 0.27 either way) and role
                        # obedience fell 1.00 -> 0.94, with one flat channel instead of two. So the
                        # diffuseness is not caused by the size ladder, and de-aligning the two
                        # ladders buys nothing here. Kept as a knob because the reasoning still
                        # applies to a testbed whose static pattern is small.
    lambda_level: 0.13  # gradient-matched: |g_level|=4.0e-2 vs |g_white|=5.1e-3 at init. At init the
                        # slow rungs sit at r=0.10/0.09 against a 0.95 target, so this is the
                        # steepest term in the loss by far -- hence the small weight.
    # long-lag memory hinge, SLOW rungs only (`slow_objective: memory`): the band alone left them
    # (tau_e 36 vs the truth's 106, best mode a chaotic one at corr 0.50 -- run 20260831_091525).
    mem_lag: 64         # rho at this lag. OU tau=200 -> 0.73; cycles P=300/140 -> 0.23/-0.96
    mem_target: 0.6     # hinge: slow rungs must keep rho(mem_lag) >= this
    lambda_mem: 0.4     # gradient-matched: |g_mem|=9.5e-3 vs |g_white|=3.9e-3 at init -> 0.41.
                        # This is the STRONGEST-gradient term in the loss, hence the small weight.
  # lambda_energy / lambda_recon defaults are GRADIENT-MATCHED to lambda_white at init, measured
  # per-term with tmp/g.py: |g_slow|=6.7e-6, |g_white|=1.7e-4, |g_energy|=8.8e-4, |g_recon|=5.0e-4.
  # Balance the GRADIENTS, not the loss values -- the values differ by 300x and mislead.
  log_every: 50
  t_train: null         # SOP 02 time split: observer learns only from [0, t_train). null = full record
                        # (historical default). 1400 = module-2 protocol (D-030): scored days stay unseen.
  snap_every: 0         # save the masks every N steps into artifacts.npz (masks_snap, snap_steps) for the
                        # observer-stability probe. 0 = off (default; artifacts unchanged).

# run dir + all artifacts + TensorBoard land under ./.tmps/ (D-014)
hydra:
  run:
    dir: ${hydra:runtime.cwd}/.tmps/runs/${now:%Y%m%d_%H%M%S}
  job:
    chdir: true           # Hydra>=1.2 defaults to false -> artifacts would land in the repo root
