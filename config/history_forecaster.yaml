# VENN module 2 — HISTORY FORECASTER, the "prefrontal cortex" (latent emulator, SOP 04). Every hyperparameter lives here (D-014).
#   python -m src.train.train_history_forecaster hf.encoder_run=.tmps/runs/hf_enc_seed0
defaults:
  - config              # inherit seed / device from the encoder config
  - _self_

hf:
  encoder_run: null     # frozen eye-hippocampus run dir holding artifacts.npz (required)
  t_tr: 2000            # training set = [0, t_tr); validation set = [t_tr, T). Must equal the encoder's t_train
  t_fit: null           # targets used for fitting are < t_fit. null = t_tr (final run).
                        # t_fit = 1750 -> DEVELOPMENT run: hyperparameters judged on [1750, 2000), never on validation
  leads: 64             # direct heads psi_{t+1} ... psi_{t+leads}; lead 1 is the primary target
  stationary_scale: std # how STATIONARY channels (amp_ratio < 0.05 on the fitting range) are scaled before the model
                        # reads them: std = own std like every channel (ruling 2026-10-01, F-27) | level = signal size
                        # sqrt(mu^2+sd^2): a stationary history is "level + leak" and the ~4 % leak is not magnified
                        # into a unit-variance target (user 2026-10-06, SOP 04). D-033: keep std; level gave the same
                        # h64 error (3.4 % of signal size) and a worse h1 (0.6 % vs 0.4 %) -> experiment only
  # --- model ---
  d: 64                 # token width
  layers: 3             # causal attention blocks
  heads: 4
  dropout: 0.4          # ONE 2000-step trajectory -> the model memorizes it (seen-data corr 0.96 at lead 64, unseen 0.55).
                        # Dev sweep, fit [0,1750) judged on [1750,2000), seeds 0/1 (2026-09-29): dropout 0.4 + wd 0.3 beat
                        # 0.2/0.1 at every lead (h1 +0.74/+0.73 vs +0.71/+0.67, h64 +0.59/+0.64 vs +0.52/+0.54);
                        # stopping at 1000 steps or d=32/2 layers did not help
  # --- optimization ---
  steps: 3000
  lr: 1.0e-3
  weight_decay: 0.3     # see dropout
  grad_clip: 1.0
  batch: 4              # full-history sequences per step
  max_start: 500        # each sequence = z[s0 : t_fit], s0 ~ U[0, max_start): varied, always long, histories
  min_sight: 32         # positions with less history than this are left out of the loss
  input_noise: 0.0      # std (training-std units) of noise added to the history the model READS in training;
                        # targets stay clean. Anti-memorization knob. 0 = off (F-21 setting)
  eval_every: 250       # log the development / training-tail loss to TensorBoard
  # --- chaotic channels carry the uncertainty (SOP 04 ensemble section, user 2026-09-29) ---
  ensemble:
    enable: false       # false = deterministic model (reproduces F-21). true = noise-driven ensemble head on the
                        # channels labelled CHAOTIC on the fitting range; stationary/cyclic stay deterministic
    mode: multi_scenario  # multi_scenario = MULTI-SCENARIO mode (default, F-22/F-23): the predictor reads the
                        # history once and writes M scenarios for the CHAOTIC channels (CRPS-trained); stationary/
                        # cyclic keep one forecast. memory = REJECTED (user 2026-10-02): chaotic-memory ensemble,
                        # spread collapsed (SOP 04). "output" = old name of multi_scenario (still accepted)
    families: chaotic   # which channels get scenarios: chaotic (F-22/F-23) | all = multi-scenario for the WHOLE
                        # family (user 2026-10-02), fair CRPS on every channel
    spread_from: crps   # how the scenario width is set after training on [t_fit, t_tr): crps = per-lead factor
                        # minimizing chaotic CRPS (F-22/F-23) | score = predefined CERTAINTY SCORE, i.e. the
                        # held-out RMSE per channel x lead; each channel's spread is made equal to it (SOP 04)
    members: 8          # members per launch during training (fair CRPS is unbiased for any M >= 2)
    noise_dim: 16       # size of the per-member noise vector eps
    lambda_crps: 1.0    # weight of the chaotic-channel CRPS against the non-chaotic MSE
    calibrate: true     # after training, fit a per-lead spread inflation on [t_fit, t_tr) (held-out end of the
                        # training set; needs t_fit < t_tr, e.g. hf.t_fit=1750). Fixes the overconfidence (SOP 04)

hydra:
  run:
    dir: ${hydra:runtime.cwd}/.tmps/runs_hf/${now:%Y%m%d_%H%M%S}
  job:
    chdir: true
